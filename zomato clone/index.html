<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato</title>
<style>
    body{
        margin:0px
    }
    .hero{
        height:100vh;
        width:100vw;
        position:relative;
    }
    .vid{
        height: 100%;
        width:100%;
        object-fit:cover;
    }
    .txt{
        position:absolute;
        top:50%;
        left:50%;
        transform: translate(-50%,-50%);
        width:500px;
        text-align:center;
    }
</style>
</head>
<body>
    <div class="hero">
       
            <video class="vid" width="100%" autoplay loop muted>
                <source src="https://b.zmtcdn.com/data/file_assets/2627bbed9d6c068e50d2aadcca11ddbb1743095810.mp4">
             </video>

       
        <div class="txt">
            <img src="https://b.zmtcdn.com/web_assets/8313a97515fcb0447d2d77c276532a511583262271.png" width="210">
            <h1>India's #1<br>food delivery app</h1>
            <div>Experience fast & easy online ordering on the Zomato app</div>
  
        </div>

    </div>
    
</body>
</html>
