<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Pagination, Progress Bar, Spinners</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1>These are Spinners</h1>
        <h2>Spinner Border</h2>
        <span class="spinner-border text-danger"></span>
        <span class="spinner-border text-primary"></span>
        <span class="spinner-border text-success"></span>
        <span class="spinner-border text-info"></span>
        <span class="spinner-border text-dark"></span>
        <h2>Spinner Grow</h2>
        <span class="spinner-grow text-danger"></span>
        <span class="spinner-grow text-primary"></span>
        <span class="spinner-grow text-success"></span>
        <span class="spinner-grow text-info"></span>
        <span class="spinner-grow text-dark"></span>
    </div>
    <hr>
    <h1>Progress Bar</h1>
<div style="display: flex;">
    5 star
    <div class="progress m-3" style="width: 50%;">
        <div class="progress bar progress-bar-striped progress-bar-animated bg-warning" style="width:15%"> 15% </div>
    </div>
</div>
<hr>
<div style="display:flex;">
    4 star
    <div class="progress m-3" style="width: 50%;">
        <div class="progress bar progress-bar-striped progress-bar-animated bg-warning" style="width:30%"> 30% </div>
    </div>
</div>
<hr>
<div style="display:flex;">    
    3 star
    <div class="progress m-3" style="width: 50%;">
        <div class="progress bar progress-bar-striped progress-bar-animated bg-warning" style="width:50%"> 60% </div>
    </div>
</div>
<hr><hr>
<div style="display:flex;">
    <span>5 star</span>
    <div class="progress m-2" style="width: 50%;">
    <div class="progress bar" style="width: 59%;">59%</div>
</div>
        <span>59%</span>
    </div>

</body>
</html>
