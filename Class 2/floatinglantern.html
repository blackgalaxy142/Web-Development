<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Lanterns</title>
</head>
<style>
    body{
        margin:0;
    }
    .canvas{
        height: 100vh;
        width:100vw;
        background-image: url('https://spangled-airport-56f.notion.site/image/attachment%3A31c784af-65c5-42c4-a468-b37325cf2ac4%3Anight_2.png?table=block&id=38a76128-a3ef-8092-9eba-c302e43a4590&spaceId=7fe7e42f-26b9-4c2a-96d4-91cf7b1472e3&width=740&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl');
        background-size: cover;
        background-position:center;
        position:relative
    }
    .lantern{
        position:absolute;
        bottom:-150px;
        left:300px;
        filter: drop-shadow(10px 10px 20px brown);
        animation:floating linear 10s infinite;
    }
    .lantern2{
        position:absolute;
        bottom:-150px;
        left:900px;
        filter:drop-shadow(10px 10px 20px brown);
        animation:floating linear 9s infinite; 
    }
    @keyframes floating{
        from{
            bottom:0%;
            transform: translateX(0px);
        }
        to{
            bottom:100%;
            transform: translate(500px);
        }
    }
</style>
<body>
    <div class="canvas">
        <div class="lantern">
            <img src="lan3.png " width="150">
        </div>
        <div class="lantern2">
            <img src="lan2.png" width="150">
        </div>
    </div>
</body>
</html>
