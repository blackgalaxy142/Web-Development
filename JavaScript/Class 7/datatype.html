<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Type</title>
</head>
<body>

    <script>
        var x = 10;
        var y = 20.55;
        var z = 'suria'
        var isSuriaFromUSA = true //yes--> true, //no-->false
        var isSuriaFromuk = false //yes--> true, //no-->false
        document.write(`x value ${x}<br>`)
        document.write(`type of data of x variable is ${typeof x} <br>`)
        document.write(`y value ${y}<br>`)
        document.write(`type of data of y variable is ${typeof y} <br>`)
        document.write(`x value ${z}<br>`)
        document.write(`type of data of z variable is ${typeof z} <br>`)
        document.write(`x value ${isSuriaFromUSA}<br>`)
        document.write(`type of data of isSuriaFromUSA variable is ${typeof isSuriaFromUSA} <br>`)
        document.write(`x value ${isSuriaFromuk}<br>`)
        document.write(`type of data of isSuriaFromuk variable is ${typeof isSuriaFromuk} <br>`)
    </script>
</body>
</html>
