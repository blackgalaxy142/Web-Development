<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Counter</title>
</head>
<body>
    <p id="id1">0</p>
    <button onclick="f1()">Practice Counter (+2 units per second) </button>
    <script>
        var value=0

        function f1(){
            document.getElementById("id1").innerHTML=value
            setInterval(f2, 1000)
        }
        function f2(){
            value= value + 2
            document.getElementById("id1").innerHTML=value
        }
    </script>
</body>
</html>
