<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equal or Not</title>
</head>

<body>
    <input id="inp1" type="number"><br><br>
    <input id="inp2" type="number"><br><br>
    <button onclick="EqualorNot()"> Check if #'s are equal or not</button>
    <button onclick="Lessthan()">Check if num1 is less than num2</button>
    <button onclick="Greaterthan()">Check if num1 is greater than num2</button>
    <button onclick="Lessthanorequal()">Check is num1 is less than or equal to num2</button>
    <button onclick="Greaterthanorequal()">Check is num1 is greater than or equal to num2</button>
    <p id="pid1"> Result: _________ </p>

    <script>
        var num1 = 0
        var num2 = 0

        function EqualorNot() {
            num1 = Number(document.getElementById("inp1").value)
            num2 = Number(document.getElementById("inp2").value)
            document.getElementById("pid1").innerHTML = (`${num1 == num2}`)
        }
        function Lessthan() {
            num1 = Number(document.getElementById("inp1").value)
            num2 = Number(document.getElementById("inp2").value)
            document.getElementById("pid1").innerHTML = (`${num1 < num2}`)
        }
        function Greaterthan(){
            num1= Number(document.getElementById("inp1").value)
            num2 = Number(document.getElementById("inp2").value)
            document.getElementById("pid1").innerHTML = (`${num1 > num2}`)
        }
        function Lessthanorequal() {
            num1 = Number(document.getElementById("inp1").value)
            num2 = Number(document.getElementById("inp2").value)
            document.getElementById("pid1").innerHTML = (`${num1 <= num2}`)
        }
        function Greaterthanorequal() {
            num1 = Number(document.getElementById("inp1").value)
            num2 = Number(document.getElementById("inp2").value)
            document.getElementById("pid1").innerHTML = (`${num1 >= num2}`)
        }
    </script>
</body>

</html>
