<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .card1 {
            height: 250px;
            width: 250px;
            background: linear-gradient(to left, rgb(87, 140, 255), rgb(130, 188, 255));
            text-align: center;
            margin: 10px;
            border-radius: 15px;
            padding: 10px;
            row-gap: 10px;
            margin: 100px auto;
        }

        .number {
            background-color: rgb(65, 65, 196);
            border: rgb(52, 52, 150);
            border-radius: 40px;
            color: aliceblue;
            padding: 3px;
            width: 40px;
            margin: 2px;
        }

        .symbol {
            background-color: rgb(129, 63, 228);
            border: rgb(52, 52, 150);
            border-radius: 40px;
            color: aliceblue;
            padding: 3px;
            width: 40px;
        }

        input {
            padding: 7px;
            border-radius: 10px;
            text-align: end;
        }

        input:focus {
            background-color: lightcyan
        }

        .number:hover {
            background-color: rgb(86, 90, 207);
        }

        .symbol:hover {
            background-color: rgb(140, 72, 241);
        }

        .number:active {
            background-color: rgb(43, 47, 151);
            transform: translateY(-2px);
            box-shadow: 3px 3px 5px 0px black;
        }

        .symbol:active {
            background-color: rgb(84, 7, 200);
            transform: translateY(-2px);
            box-shadow: 3px 3px 5px 0px black;
        }
    </style>
</head>

<body>
    <div class=" col-md-4">
        <div class="card1" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title"></h5>
                <br><input id="imp"><br><br>
                <button onclick="takeInput('1')" class="number">1</button>
                <button onclick="takeInput('2')" class="number">2</button>
                <button onclick="takeInput('3')" class="number">3</button>
                <button onclick="takeInput('+')"class="symbol">+</button><br>
                <button onclick="takeInput('4')"class="number">4</button>
                <button onclick="takeInput('5')"class="number">5</button>
                <button onclick="takeInput('6')"class="number">6</button>
                <button onclick="takeInput('-')"class="symbol">-</button><br>
                <button onclick="takeInput('7')"class="number">7</button>
                <button onclick="takeInput('8')"class="number">8</button>
                <button onclick="takeInput('9')"class="number">9</button>
                <button onclick="takeInput('*')"class="symbol">*</button><br>
                <button onclick="takeInput('0')"class="number">0</button>
                <button onclick="takeInput('.')"class="number">.</button>
                <button onclick="calculate()"class="symbol">=</button>
                <button onclick="takeInput('/')"class="symbol">/</button>
                </input>

            </div>
        </div>
    </div>

    <script>
        function takeInput(inputValue){
           // document.write(value)
           document.getElementById("imp").value=inputValue;
        }
        function calculate(){
            var mathExpression = document.getElementById("imp").value
            //document.write(mathExpression)
            var result=eval(mathExpression)
            document.getElementById("imp").value=result
        }  
        //you click on = ---> calls a function called calculate()
//creating variable called mathExpression and taking the value from
//input area with id imp
//then it writes on doc whatever we have in mathexp 
    </script>
</body>

</html>
