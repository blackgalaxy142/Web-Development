<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .card1{
            height:250px;
            width:250px;
            background:linear-gradient(to left,rgb(87, 140, 255), rgb(130, 188, 255));
            text-align:center;
            margin:10px;
            border-radius:15px;
            padding:10px;
            row-gap: 10px;
            margin:100px auto;
        }
        .number{
            background-color:rgb(65, 65, 196);
            border:rgb(52, 52, 150);
            border-radius:40px;
            color:aliceblue;
           padding:3px;
            width:40px;
            margin:2px;
        }
        .symbol{
            background-color:rgb(129, 63, 228);
            border:rgb(52, 52, 150);
            border-radius:40px;
            color:aliceblue;
            padding:3px;
            width:40px;
        }
    </style>
</head>

<body>
   <div class=" col-md-4">
                    <div class="card1" style="width: 18rem;">
                        <div class="card-body">
                            <h5 class="card-title"></h5>
                            <br><input><br><br>
                                <button  class="number">1</button>
                                <button class="number">2</button>
                                <button class="number">3</button>
                                <button class="symbol">+</button><br>
                                <button class="number">4</button>
                                <button class="number">5</button>
                                <button class="number">6</button>
                                <button class="symbol">-</button><br>
                                <button class="number">7</button>
                                <button class="number">8</button>
                                <button class="number">9</button>
                                <button class="symbol">*</button><br>
                                <button class="number">0</button>
                                <button class="number">.</button>
                                <button class="symbol">=</button>
                                <button class="symbol">/</button>
                        </input>
                            
                        </div>
                    </div>
                </div>

    
    <script></script>
</body>
</html>
