<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <p id="pid1">this is text</p>
    <button class="btn btn-primary" onclick="groot()">call groot</button>
    <hr>

    <div>
      <input id="inp1" placeholder="Enter a number" value="0"><br><br>
      <input id="inp2" placeholder="Enter a number" value="0"><br><br>
      
        Result :<p id="resId">0</p>
        <button class="btn btn-danger" onclick="add()">Add</button>
        <button class="btn btn-danger" onclick="Subtraction()">Sub</button>
        <button class="btn btn-danger" onclick="Multiplication()">Mul</button>
        <button class="btn btn-danger" onclick="Division()">Div</button>
        <button class="btn btn-danger" onclick="Remainder()">Rem</button>

    </div>
    <script>
        //function:it is like a small robot that does SOMETHING//
    function groot (){
        var name=prompt("Enter your name:")
        //document.write("Hello, I am GROOT!!<br>")
        document.getElementById("pid1").innerHTML=`Bello ${name}, I am Groot!`
    }
    function add(){
        var num1= Number(document.getElementById("inp1").value)
        var num2= Number(document.getElementById("inp2").value)
        var sum= num1 + num2
        document.getElementById("resId").innerHTML=`sum of ${num1} and ${num2}=${sum}`
    }
    function Subtraction(){
       var num1= Number(document.getElementById("inp1").value)
        var num2= Number(document.getElementById("inp2").value)
        var sub= num1 - num2
        document.getElementById("resId").innerHTML=`${num1} minus ${num2}=${sub}`
    }
    function Multiplication(){
       var num1= Number(document.getElementById("inp1").value)
        var num2= Number(document.getElementById("inp2").value)
        var product= num1*num2
        document.getElementById("resId").innerHTML=`product of ${num1} and ${num2}=${product}`
    }
    function Division(){
        var num1= Number(document.getElementById("inp1").value)
        var num2= Number(document.getElementById("inp2").value)
        var div= num1/num2
        document.getElementById("resId").innerHTML=`${num1} divided by ${num2}=${div}`
    }
    function Remainder(){
         var num1= Number(document.getElementById("inp1").value)
        var num2= Number(document.getElementById("inp2").value)
        var xyz= num1%num2
        document.getElementById("resId").innerHTML=`remainder of ${num1} and ${num2}=${xyz}`
    }
    //call the robot
    //1st way is below, 2nd way (most pop) using onclick button above
    //groot()
    //groot()
    
    
    
    
    </script>
    
</body>
</html>
