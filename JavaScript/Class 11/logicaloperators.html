<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical Operators </title>
</head>

<body>
    <script>
        // && = *
        // || = +
        // true = 1   false = 0
        document.write('-------------truth table of AND operator--------- <br>')
        document.write(`true && true --> &{true && true}<br>`)
        document.write(`true && false --> &{true && false}<br>`)
        document.write(`false && true --> &{false && true}<br>`)
        document.write(`false && false --> &{false && false}<br><br>`)

        document.write('-------------truth table of OR operator---------<br>')
        document.write(`true || true --> &{true || true}<br>`)
        document.write(`true || false --> &{true || false}<br>`)
        document.write(`false || true --> &{false || true}<br>`)
        document.write(`false || false --> &{false || false}<br><br>`)


        document.write('-------------truth table of NOT operator----------<br>')



    </script>
</body>

</html>
