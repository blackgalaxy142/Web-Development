<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delayed Welcome Card</title>
</head>

<body>
    <input id="inp">
    <p id="id1">Your name's greeting</p>
    <button onclick="greeting()">See your greeting</button>
    <script>
        var name = ""
        function greeting() {
            //var name= document.getElementById("inp").value
            name= document.getElementById("inp").value
            document.getElementById("id1").textContent = "Please wait..."
            setTimeout(delaygreeting, 3000)
        }
        function delaygreeting() {
            //var name= document.getElementById("inp").value
            name= document.getElementById("inp").value
            document.getElementById("id1").textContent = "Welcome, " + name
        }

    </script>
</body>

</html>
