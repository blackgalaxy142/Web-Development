<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <style>
        body{
            margin:0px;
        }
    </style>
    </head>

<body>
    <div class="container-fluid" style="height: 50%;">
        <div class="carousel slide" id="suriaid">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="https://wallpapercat.com/w/full/1/9/3/104901-3840x2160-desktop-4k-spider-man-into-the-spider-verse-wallpaper-image.jpg"
                        class="card-img-top d-block w-100" height="500">
                        <div class="carousel-caption">
                            <h3>Into the Spiderverse movie</h3>
                        </div>
                </div>


                <div class="carousel-item">
                    <img src="https://images8.alphacoders.com/605/605895.jpg" class="card-img-top d-block w-100"
                        height="500">
                        <div class="carousel-caption">
                            <h3>Big Hero 6 Movie</h3>
                        </div>
                </div>

            </div>
            <div class="carousel-indicators">
                <button data-bs-target="#suriaid" data-bs-slide-to="0" class="active"></button>
                <button data-bs-target="#suriaid" data-bs-slide-to="1"></button>


            </div>
            <button class="carousel-control-prev" data-bs-target="#suriaid" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" data-bs-target="#suriaid" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>   
        </div>

    </div>
</body>

</html>
